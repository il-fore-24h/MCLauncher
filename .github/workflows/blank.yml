
name: Download Mods - Minecraft 1.21.1 Fabric

on:
  workflow_dispatch:

jobs:
  download-mods:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Download compatible mods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mods

          download_mod() {
            local project="$1"
            local name="$2"

            echo "Searching compatible versions for $name..."

            curl -fsSL \
              "https://api.modrinth.com/v2/project/${project}/version" \
              -o versions.json

            local url
            url=$(jq -r '
              [
                .[]
                | select(any(.game_versions[]?; . == "1.21.1"))
                | select(any(.loaders[]?; . == "fabric"))
                | .files[]
                | select(.filename | endswith(".jar"))
              ]
              | sort_by(.date_published)
              | last
              | .url // empty
            ' versions.json)

            if [ -z "$url" ]; then
              echo "::error::No compatible Fabric version found for $name"
              exit 1
            fi

            curl -fL "$url" -o "mods/${name}.jar"
            echo "Downloaded $name"
          }

          # Forge Config API Port
          download_mod "forge-config-api-port" \
            "ForgeConfigAPIPort"

          # Fabric API
          download_mod "fabric-api" "FabricAPI"

      - name: Upload mods
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-1.21.1-Fabric-Mods
          path: mods/*.jar
          if-no-files-found: error
