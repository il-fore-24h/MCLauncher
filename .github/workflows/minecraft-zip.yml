name: Package Minecraft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version to package
        default: '1.8.9'
        required: true
      include_java:
        description: Bundle the Java runtime required by this version
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage launcher and tools
        run: |
          mkdir -p package/Minecraft/tools
          cp mclauncher-tui.sh package/
          cp README.md package/
          curl -fsSL -o package/Minecraft/tools/jq.exe \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe

      - name: Install ${{ inputs.version }}
        run: bash package/mclauncher-tui.sh --install "$VERSION" "$PWD/package/Minecraft"

      - name: Detect required Java
        id: java
        if: ${{ inputs.include_java }}
        run: |
          major=$(jq -r '.javaVersion.majorVersion // 8' "package/Minecraft/versions/$VERSION/$VERSION.json")
          echo "$VERSION needs Java $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: ${{ inputs.include_java }}
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.major }}

      - name: Bundle Java
        if: ${{ inputs.include_java }}
        run: cp -r "$(cygpath -u "$JAVA_HOME")" package/Minecraft/java

      - name: Create zip
        run: |
          find package -name '*.download' -delete
          (cd package && 7z a -tzip -mx=5 "../minecraft-$VERSION.zip" . > /dev/null)
          ls -lh "minecraft-$VERSION.zip"

      - name: Publish release
        run: |
          tag="minecraft-$VERSION"
          zip="minecraft-$VERSION.zip"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "Minecraft $VERSION" \
              --notes "Minecraft $VERSION con launcher Git Bash. Estrai lo zip e leggi il README."
          fi
